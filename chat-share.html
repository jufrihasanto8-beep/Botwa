<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="img/logo-adsy.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Customer · Adsy CS AI</title>
<script>if(localStorage.getItem('cs_theme')==='light')document.documentElement.classList.add('light');</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--white:#161b22;--border:rgba(255,255,255,.08);--text:#e2e8f0;--text-2:#64748b;--text-3:#475569;--card-bg:#1c2333}
body.light{--bg:#f1f5f9;--white:#ffffff;--border:rgba(0,0,0,.07);--text:#0f172a;--text-2:#475569;--text-3:#94a3b8;--card-bg:#ffffff}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}

/* Container */
.page-wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--white);border-left:1px solid var(--border);border-right:1px solid var(--border)}

/* Header */
.chat-header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--white);position:sticky;top:0;z-index:10}
.chat-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}
.chat-info{flex:1;min-width:0}
.chat-name{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-meta{font-size:11px;color:var(--text-3);margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chat-phone{font-family:monospace;font-size:11px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600}
.badge-problem{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
.badge-product{background:rgba(59,130,246,.1);color:#3b82f6;border:1px solid rgba(59,130,246,.2)}
.badge-resi{background:rgba(34,197,94,.1);color:#22c55e;border:1px solid rgba(34,197,94,.2);font-family:monospace}

/* Order info card */
.order-card{margin:12px 14px 4px;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--text-2);display:none}
.order-card.show{display:block}
.order-card-title{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.order-row{display:flex;justify-content:space-between;padding:3px 0}
.order-row .label{color:var(--text-3)}
.order-row .val{color:var(--text);font-weight:500}

/* Chat body */
.chat-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.chat-body::-webkit-scrollbar{width:4px}
.chat-body::-webkit-scrollbar-thumb{background:rgba(100,100,100,.2);border-radius:4px}

/* Bubbles */
.chat-row{display:flex;margin-bottom:1px}
.chat-row.from-customer{justify-content:flex-start}
.chat-row.from-bot{justify-content:flex-end}
.chat-bubble{max-width:82%;min-width:40px;padding:7px 11px;border-radius:10px;font-size:13px;line-height:1.5;word-break:break-word;white-space:pre-wrap;text-align:left}
.chat-row.from-customer .chat-bubble{background:#f0f0f0;color:#1a1a1a;border-bottom-left-radius:3px}
.chat-row.from-bot .chat-bubble{background:#3b82f6;color:#fff;border-bottom-right-radius:3px}
.chat-row.from-system{justify-content:center}
.chat-row.from-system .chat-bubble{background:rgba(100,116,139,.08);color:var(--text-2);font-size:11px;max-width:90%;text-align:center;border-radius:8px}
.chat-time-inline{font-size:10px;color:rgba(0,0,0,.35);float:right;margin:6px 0 -3px 10px;line-height:1}
.chat-time-bot{color:rgba(255,255,255,.55)}
.chat-label{font-size:10px;font-weight:600;display:block;margin-bottom:2px}
.chat-label.ai{color:rgba(255,255,255,.7)}
.chat-label.cs{color:#fbbf24}
.chat-date-div{text-align:center;font-size:10px;color:var(--text-3);margin:8px 0;font-weight:600}
.chat-loading{text-align:center;padding:60px 20px;color:var(--text-3);font-size:13px}
.chat-empty{text-align:center;padding:60px 20px;color:var(--text-3);font-size:13px}
.chat-empty h3{font-size:16px;font-weight:700;color:var(--text-2);margin-bottom:8px}

body.light .chat-row.from-customer .chat-bubble{background:#f0f0f0;color:#1a1a1a}
body.light .chat-row.from-bot .chat-bubble{background:#2563eb}

/* Footer */
.chat-footer{padding:10px 18px;border-top:1px solid var(--border);font-size:10px;color:var(--text-3);text-align:center;flex-shrink:0}
.chat-footer a{color:#3b82f6;text-decoration:none}

/* Theme toggle */
.theme-btn{position:fixed;top:14px;right:14px;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--white);color:var(--text-2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:20}

@media(max-width:520px){
  .page-wrap{border:none}
  .chat-bubble{max-width:88%}
}
</style>
</head>
<body>

<button class="theme-btn" onclick="document.body.classList.toggle('light');localStorage.setItem('cs_theme',document.body.classList.contains('light')?'light':'dark')">🌓</button>

<div class="page-wrap">
  <div class="chat-header" id="chat-header">
    <div class="chat-avatar" id="avatar">?</div>
    <div class="chat-info">
      <div class="chat-name" id="cust-name">Memuat...</div>
      <div class="chat-meta" id="cust-meta"></div>
    </div>
  </div>

  <div class="order-card" id="order-card">
    <div class="order-card-title">Info Order</div>
    <div id="order-rows"></div>
  </div>

  <div class="chat-body" id="chat-body">
    <div class="chat-loading">Memuat percakapan...</div>
  </div>

  <div class="chat-footer">
    Adsy CS AI &middot; <span id="foot-time"></span>
  </div>
</div>

<script>
const SB_URL = 'https://hdplngjvthwcmgkehmvy.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkcGxuZ2p2dGh3Y21na2VobXZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MTcyMDIsImV4cCI6MjA5NjQ5MzIwMn0.1Q9L9J8txAtcJYq_B3grjpd3NWKskJX2lr5mpCjm9Qg';

function sbFetch(table, query) {
  return fetch(`${SB_URL}/rest/v1/${table}${query}`, {
    headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' }
  }).then(r => r.json()).catch(() => []);
}

function normalizePhone(raw) {
  let p = (raw || '').replace(/[^0-9]/g, '');
  if (p.startsWith('0')) p = '62' + p.slice(1);
  if (!p.startsWith('62')) p = '62' + p;
  return p;
}

function formatPhone(p) {
  const s = (p || '').replace(/^62/, '0');
  return s.replace(/(\d{4})(\d{4})(\d+)/, '$1-$2-$3');
}

function fmtRp(n) {
  return 'Rp ' + (n || 0).toLocaleString('id-ID');
}

function getParams() {
  const u = new URLSearchParams(location.search);
  return {
    phone: u.get('phone') || u.get('hp') || u.get('wa') || '',
    conv: u.get('conv') || u.get('conversation_id') || '',
    customer: u.get('customer') || u.get('customer_id') || ''
  };
}

async function init() {
  const params = getParams();
  const body = document.getElementById('chat-body');

  if (!params.phone && !params.conv && !params.customer) {
    body.innerHTML = '<div class="chat-empty"><h3>Link tidak valid</h3>Tambahkan parameter ?phone=08xxxx di URL</div>';
    return;
  }

  try {
    // 1. Find customer
    let customer = null;
    let conversations = [];

    if (params.conv) {
      // Direct conversation ID
      const convs = await sbFetch('conversations', `?id=eq.${params.conv}&select=*`);
      if (convs[0]) {
        conversations = convs;
        const custs = await sbFetch('customers', `?id=eq.${convs[0].customer_id}&select=*`);
        customer = custs[0];
      }
    } else {
      // Find by phone
      const phone = normalizePhone(params.phone || '');
      const custs = await sbFetch('customers', `?wa_number=eq.${phone}&select=*`);
      if (custs.length > 1 && params.customer) {
        customer = custs.find(c => c.id === params.customer) || custs[0];
      } else {
        customer = custs[0];
      }
      if (customer) {
        conversations = await sbFetch('conversations', `?customer_id=eq.${customer.id}&order=created_at.desc&select=*`);
      }
    }

    if (!customer && !conversations.length) {
      body.innerHTML = '<div class="chat-empty"><h3>Customer tidak ditemukan</h3>Nomor ' + (params.phone || params.conv || '') + ' tidak ada di database</div>';
      return;
    }

    // 2. Render header
    const nama = customer?.nama || 'Customer';
    document.getElementById('cust-name').textContent = nama;
    document.getElementById('avatar').textContent = nama.charAt(0).toUpperCase();
    document.title = nama + ' · Chat · Adsy CS AI';

    let metaHtml = '';
    if (customer?.wa_number) metaHtml += `<span class="chat-phone">${formatPhone(customer.wa_number)}</span>`;

    // 3. Find orders for this customer
    const orders = customer ? await sbFetch('orders_new', `?customer_id=eq.${customer.id}&order=created_at.desc&limit=5&select=*`) : [];

    // Check delivery issues
    const problemOrders = orders.filter(o => o.status_tracking === 'bermasalah' || o.status_tracking === 'retur' || (conversations[0]?.state?.delivery_issue));
    if (problemOrders.length) {
      metaHtml += '<span class="badge badge-problem">Bermasalah</span>';
    }

    // Product badge
    const conv = conversations[0];
    if (conv?.product_id) {
      const prods = await sbFetch('products', `?id=eq.${conv.product_id}&select=nama`);
      if (prods[0]) metaHtml += `<span class="badge badge-product">${prods[0].nama}</span>`;
    }

    // Resi badge
    const resiOrder = orders.find(o => o.no_resi);
    if (resiOrder) metaHtml += `<span class="badge badge-resi">${resiOrder.no_resi}</span>`;

    document.getElementById('cust-meta').innerHTML = metaHtml;

    // 4. Order info card
    if (orders.length) {
      const o = orders[0];
      const card = document.getElementById('order-card');
      let rows = '';
      if (o.product_nama && o.product_nama !== '-') rows += `<div class="order-row"><span class="label">Produk</span><span class="val">${o.product_nama} x${o.qty || 1}</span></div>`;
      if (o.metode) rows += `<div class="order-row"><span class="label">Metode</span><span class="val">${(o.metode || '').toUpperCase()}</span></div>`;
      if (o.ekspedisi) rows += `<div class="order-row"><span class="label">Ekspedisi</span><span class="val">${o.ekspedisi}</span></div>`;
      if (o.harga) rows += `<div class="order-row"><span class="label">Harga</span><span class="val">${fmtRp(o.harga)}</span></div>`;
      if (o.ongkir) rows += `<div class="order-row"><span class="label">Ongkir</span><span class="val">${fmtRp(o.ongkir)}</span></div>`;
      if (o.total) rows += `<div class="order-row"><span class="label">Total</span><span class="val" style="font-weight:700">${fmtRp(o.total)}</span></div>`;
      if (o.no_resi) rows += `<div class="order-row"><span class="label">Resi</span><span class="val" style="font-family:monospace">${o.no_resi}</span></div>`;
      if (o.status_tracking) rows += `<div class="order-row"><span class="label">Status</span><span class="val">${o.status_tracking}</span></div>`;
      if (o.alamat?.jalan) rows += `<div class="order-row"><span class="label">Alamat</span><span class="val">${o.alamat.jalan}, ${o.alamat.kecamatan || ''}, ${o.alamat.kabupaten || ''}</span></div>`;
      if (rows) {
        document.getElementById('order-rows').innerHTML = rows;
        card.classList.add('show');
      }
    }

    // 5. Load messages — use conversation from param or latest
    const convId = params.conv || (conv?.id);
    if (!convId) {
      body.innerHTML = '<div class="chat-empty">Belum ada percakapan untuk customer ini</div>';
      return;
    }

    const msgs = await sbFetch('conv_messages', `?conversation_id=eq.${convId}&order=created_at.asc&limit=500&select=role,isi,created_at`);

    if (!msgs || !msgs.length) {
      body.innerHTML = '<div class="chat-empty">Tidak ada pesan ditemukan</div>';
      return;
    }

    // 6. Render chat bubbles
    let html = '';
    let lastDate = '';
    msgs.forEach(m => {
      const d = new Date(m.created_at);
      const dateStr = d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'Asia/Jakarta' });
      if (dateStr !== lastDate) {
        html += `<div class="chat-date-div">${dateStr}</div>`;
        lastDate = dateStr;
      }

      const time = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta' });
      const safe = (m.isi || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      if (m.role === 'system') {
        html += `<div class="chat-row from-system"><div class="chat-bubble">${safe}</div></div>`;
      } else if (m.role === 'customer') {
        html += `<div class="chat-row from-customer"><div class="chat-bubble">${safe}<span class="chat-time-inline">${time}</span></div></div>`;
      } else {
        const label = m.role === 'cs' ? 'CS' : 'AI';
        const cls = m.role === 'cs' ? 'cs' : 'ai';
        html += `<div class="chat-row from-bot"><div class="chat-bubble"><span class="chat-label ${cls}">${label}</span>${safe}<span class="chat-time-inline chat-time-bot">${time}</span></div></div>`;
      }
    });

    body.innerHTML = html;
    body.scrollTop = body.scrollHeight;

    // Footer time
    document.getElementById('foot-time').textContent = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Jakarta' });

  } catch(e) {
    body.innerHTML = `<div class="chat-empty"><h3>Error</h3>${e.message}</div>`;
  }
}

init();
</script>
</body>
</html>
