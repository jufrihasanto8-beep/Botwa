<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="img/logo-adsy.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Customer</title>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Helvetica,Arial,sans-serif;background:#111b21;min-height:100vh}

/* Container */
.page-wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}

/* WA Header */
.wa-header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#1f2c34;position:sticky;top:0;z-index:10}
.wa-back{color:#aebac1;font-size:20px;text-decoration:none;line-height:1}
.wa-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-weight:600;font-size:17px;letter-spacing:-.5px}
.wa-info{flex:1;min-width:0}
.wa-dl-wrap{position:fixed;bottom:20px;right:20px;z-index:20}
.wa-dl{display:flex;align-items:center;gap:6px;background:#005c4b;color:#e9edef;border:none;padding:10px 18px;border-radius:24px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:background .15s}
.wa-dl:hover{background:#007a63}
.wa-dl:active{background:#004a3d}
.wa-dl svg{flex-shrink:0}
.wa-name{font-size:15px;font-weight:500;color:#e9edef;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-status{font-size:12px;color:#8696a0;margin-top:1px}

/* Chat area — WA wallpaper */
.wa-chat{flex:1;overflow-y:auto;padding:8px 12px 12px;position:relative;background-color:#0b141a}
.wa-chat::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg width='300' height='300' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='p' patternUnits='userSpaceOnUse' width='60' height='60'%3E%3Cpath d='M15 3 L18 8 M42 7 L45 12 M5 25 L10 25 M50 30 L55 30 M20 45 L25 48 M38 50 L42 55 M12 55 L15 58 M48 18 L52 22 M30 15 L33 20 M25 35 L30 38' stroke='%23ffffff' stroke-width='.5' fill='none' opacity='.04'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='300' height='300' fill='url(%23p)'/%3E%3C/svg%3E");z-index:0;pointer-events:none}
.wa-chat>*{position:relative;z-index:1}
.wa-chat::-webkit-scrollbar{width:6px}
.wa-chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

/* Date pill */
.wa-date{text-align:center;margin:8px 0}
.wa-date span{display:inline-block;background:#182229;color:#8696a0;font-size:11.5px;padding:5px 12px;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.15)}

/* Bubble rows */
.wa-row{display:flex;margin-bottom:8px;padding:0 8px}
.wa-row.in{justify-content:flex-start}
.wa-row.out{justify-content:flex-end}
.wa-row.sys{justify-content:center}

/* Bubbles */
.wa-bubble{max-width:80%;min-width:80px;padding:6px 7px 8px 9px;border-radius:8px;font-size:14.2px;line-height:1.35;word-break:break-word;white-space:pre-wrap;position:relative;box-shadow:0 1px 0.5px rgba(0,0,0,.13)}

/* Incoming — customer */
.wa-row.in .wa-bubble{background:#202c33;color:#e9edef;border-top-left-radius:0}
.wa-row.in .wa-bubble::before{content:'';position:absolute;top:0;left:-8px;width:0;height:0;border-top:0 solid transparent;border-bottom:8px solid transparent;border-right:8px solid #202c33}

/* Outgoing — bot/cs */
.wa-row.out .wa-bubble{background:#005c4b;color:#e9edef;border-top-right-radius:0}
.wa-row.out .wa-bubble::before{content:'';position:absolute;top:0;right:-8px;width:0;height:0;border-top:0 solid transparent;border-bottom:8px solid transparent;border-left:8px solid #005c4b}

/* System */
.wa-row.sys .wa-bubble{background:#182229;color:#8696a0;font-size:12px;max-width:85%;text-align:center;border-radius:8px;padding:5px 12px;box-shadow:none}

/* Time + check */
.wa-time{float:right;margin:4px 0 -4px 12px;font-size:11px;color:rgba(233,237,239,.5);line-height:1;display:flex;align-items:center;gap:3px}
.wa-row.in .wa-time{color:rgba(134,150,160,.8)}
.wa-check{display:inline-block;width:16px;height:11px}
.wa-check svg{display:block}

/* Loading / Empty */
.wa-loading{text-align:center;padding:60px 20px;color:#8696a0;font-size:14px}
.wa-empty{text-align:center;padding:60px 20px;color:#8696a0;font-size:14px}
.wa-empty b{display:block;font-size:16px;color:#e9edef;margin-bottom:6px}

@media(max-width:520px){
  .page-wrap{max-width:100%}
  .wa-bubble{max-width:88%}
}
</style>
</head>
<body>

<div class="page-wrap">
  <div class="wa-header">
    <span class="wa-back">&#8592;</span>
    <div class="wa-avatar" id="avatar"></div>
    <div class="wa-info">
      <div class="wa-name" id="cust-name">Memuat...</div>
      <div class="wa-status" id="cust-status"></div>
    </div>
  </div>

  <div class="wa-dl-wrap">
    <button class="wa-dl" onclick="downloadChat()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download Chat
    </button>
  </div>

  <div class="wa-chat" id="chat-body">
    <div class="wa-loading">Memuat percakapan...</div>
  </div>
</div>

<script>
const SB_URL = 'https://hdplngjvthwcmgkehmvy.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkcGxuZ2p2dGh3Y21na2VobXZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MTcyMDIsImV4cCI6MjA5NjQ5MzIwMn0.1Q9L9J8txAtcJYq_B3grjpd3NWKskJX2lr5mpCjm9Qg';

function sbFetch(table, query) {
  return fetch(`${SB_URL}/rest/v1/${table}${query}`, {
    headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' }
  }).then(r => r.json()).catch(() => []);
}

function normalizePhone(raw) {
  let p = (raw || '').replace(/[^0-9]/g, '');
  if (p.startsWith('0')) p = '62' + p.slice(1);
  if (!p.startsWith('62')) p = '62' + p;
  return p;
}

function formatPhone(p) {
  const s = (p || '').replace(/^62/, '+62 ');
  return s.replace(/(\+62\s?)(\d{3})(\d{4})(\d+)/, '$1$2-$3-$4');
}

function getParams() {
  const u = new URLSearchParams(location.search);
  return {
    phone: u.get('phone') || u.get('hp') || u.get('wa') || '',
    conv: u.get('conv') || u.get('conversation_id') || '',
    customer: u.get('customer') || u.get('customer_id') || '',
    from: u.get('from') || ''
  };
}

// WA-style avatar colors
const WA_COLORS = ['#25d366','#128c7e','#075e54','#34b7f1','#00a884','#5b72a7','#d4a76a','#e06c75','#7c8cbf','#c678dd','#56b6c2','#d19a66'];
function getAvatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return WA_COLORS[Math.abs(hash) % WA_COLORS.length];
}
function getInitials(name) {
  const parts = (name || '?').trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return parts[0].slice(0, 2).toUpperCase();
}

const CHECK_SVG = `<svg viewBox="0 0 16 11" width="16" height="11"><path d="M11.07.66L5.67 6.06 3.93 4.32c-.3-.3-.77-.3-1.06 0-.3.3-.3.77 0 1.06l2.27 2.27c.3.3.77.3 1.06 0l5.93-5.93c.3-.3.3-.77 0-1.06-.3-.3-.77-.3-1.06 0z" fill="rgba(83,189,236,.85)"/><path d="M7.07.66L1.67 6.06-.07 4.32c-.3-.3-.77-.3-1.06 0-.3.3-.3.77 0 1.06l2.27 2.27c.3.3.77.3 1.06 0l5.93-5.93c.3-.3.3-.77 0-1.06-.3-.3-.77-.3-1.06 0z" fill="rgba(83,189,236,.85)"/></svg>`;

async function init() {
  const params = getParams();
  const body = document.getElementById('chat-body');

  if (!params.conv) {
    body.innerHTML = '<div class="wa-empty"><b>Link tidak valid</b>Halaman ini hanya bisa diakses melalui link yang dikirim ke grup</div>';
    return;
  }

  try {
    let customer = null;
    let conversations = [];

    const convs = await sbFetch('conversations', `?id=eq.${params.conv}&select=*`);
    if (!convs[0]) {
      body.innerHTML = '<div class="wa-empty"><b>Percakapan tidak ditemukan</b></div>';
      return;
    }
    conversations = convs;
    const custs = await sbFetch('customers', `?id=eq.${convs[0].customer_id}&select=*`);
    customer = custs[0];

    // Header
    const nama = customer?.nama || 'Customer';
    document.getElementById('cust-name').textContent = nama;
    document.title = nama + ' · Chat';
    const avatarEl = document.getElementById('avatar');
    avatarEl.textContent = getInitials(nama);
    avatarEl.style.background = getAvatarColor(nama);
    if (customer?.wa_number) {
      document.getElementById('cust-status').textContent = formatPhone(customer.wa_number);
    }

    const conv = conversations[0];
    const convId = params.conv || (conv?.id);
    if (!convId) {
      body.innerHTML = '<div class="wa-empty">Belum ada percakapan</div>';
      return;
    }

    const msgs = await sbFetch('conv_messages', `?conversation_id=eq.${convId}&order=created_at.asc&limit=500&select=role,isi,created_at`);

    if (!msgs || !msgs.length) {
      body.innerHTML = '<div class="wa-empty">Tidak ada pesan ditemukan</div>';
      return;
    }

    // Selalu filter — hanya dari notif pengiriman ke bawah
    let filtered = msgs;
    const trackingKeywords = /kendala pengiriman|bermasalah|tidak berhasil mengantar|diretur|dikembalikan|gagal antar|delivery problem/i;
    const startIdx = msgs.findIndex(m => (m.role === 'ai' || m.role === 'cs') && trackingKeywords.test(m.isi || ''));
    if (startIdx >= 0) filtered = msgs.slice(startIdx);

    // Render
    let html = '';
    let lastDate = '';
    filtered.forEach(m => {
      const d = new Date(m.created_at);
      const dateStr = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Jakarta' });
      if (dateStr !== lastDate) {
        html += `<div class="wa-date"><span>${dateStr}</span></div>`;
        lastDate = dateStr;
      }

      const time = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta' });
      const safe = (m.isi || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      if (m.role === 'system') {
        html += `<div class="wa-row sys"><div class="wa-bubble">${safe}</div></div>`;
      } else if (m.role === 'customer') {
        html += `<div class="wa-row in"><div class="wa-bubble">${safe}<span class="wa-time">${time}</span></div></div>`;
      } else {
        html += `<div class="wa-row out"><div class="wa-bubble">${safe}<span class="wa-time">${time} <span class="wa-check">${CHECK_SVG}</span></span></div></div>`;
      }
    });

    body.innerHTML = html;
    body.scrollTop = body.scrollHeight;

    // Auto-refresh setiap 15 detik — pesan baru muncul otomatis
    if (!window._chatRefreshStarted) {
      window._chatRefreshStarted = true;
      setInterval(async () => {
        try {
          const newMsgs = await sbFetch('conv_messages', `?conversation_id=eq.${convId}&order=created_at.asc&limit=500&select=role,isi,created_at`);
          if (!newMsgs || newMsgs.length <= filtered.length) return;
          // Ada pesan baru — re-render
          let newFiltered = newMsgs;
          const si = newMsgs.findIndex(m => (m.role === 'ai' || m.role === 'cs') && trackingKeywords.test(m.isi || ''));
          if (si >= 0) newFiltered = newMsgs.slice(si);
          filtered = newFiltered;

          let h = '';
          let ld = '';
          newFiltered.forEach(m => {
            const d = new Date(m.created_at);
            const ds = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Jakarta' });
            if (ds !== ld) { h += `<div class="wa-date"><span>${ds}</span></div>`; ld = ds; }
            const t = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta' });
            const s = (m.isi || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            if (m.role === 'system') h += `<div class="wa-row sys"><div class="wa-bubble">${s}</div></div>`;
            else if (m.role === 'customer') h += `<div class="wa-row in"><div class="wa-bubble">${s}<span class="wa-time">${t}</span></div></div>`;
            else h += `<div class="wa-row out"><div class="wa-bubble">${s}<span class="wa-time">${t} <span class="wa-check">${CHECK_SVG}</span></span></div></div>`;
          });
          body.innerHTML = h;
          body.scrollTop = body.scrollHeight;
        } catch(_) {}
      }, 15000);
    }

  } catch(e) {
    body.innerHTML = `<div class="wa-empty"><b>Error</b>${e.message}</div>`;
  }
}

async function downloadChat() {
  const btn = document.querySelector('.wa-dl');
  const origHTML = btn.innerHTML;
  btn.innerHTML = '&#8987; Downloading...';
  btn.disabled = true;
  try {
    const wrap = document.querySelector('.page-wrap');
    const chat = document.getElementById('chat-body');
    // Temporarily expand chat to full height so all messages are captured
    const origH = chat.style.height;
    const origO = chat.style.overflow;
    chat.style.height = 'auto';
    chat.style.overflow = 'visible';
    wrap.style.height = 'auto';
    wrap.style.minHeight = 'auto';

    const canvas = await html2canvas(wrap, {
      backgroundColor: '#0b141a',
      scale: 2,
      useCORS: true,
      scrollY: 0
    });

    // Restore
    chat.style.height = origH;
    chat.style.overflow = origO;
    wrap.style.height = '';
    wrap.style.minHeight = '100vh';

    const link = document.createElement('a');
    const nama = document.getElementById('cust-name').textContent || 'chat';
    link.download = `chat-${nama.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) {
    alert('Gagal download: ' + e.message);
  }
  btn.innerHTML = origHTML;
  btn.disabled = false;
}

init();
</script>
</body>
</html>
